<svg xmlns="http://www.w3.org/2000/svg" width="600" height="225" viewBox="0 0 600 225" role="img" aria-label="Artem Kholdzhgonov, Senior Data Engineer, Moscow. Up to 2 terabytes ingested per day, 20 to 30 pipelines in production, about 100 users across 20 plus teams. Data flow: sources to warehouse to flows to marts to BI.">
  <style>
    .s    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .name { font-size: 27px; font-weight: 600; fill: #E6EDF3; letter-spacing: -0.3px; }
    .role { font-size: 14px; font-weight: 500; fill: #C9D1D9; }
    .num  { font-size: 26px; font-weight: 600; fill: #58A6FF; }
    .cap  { font-size: 11.5px; font-weight: 600; fill: #8B949E; letter-spacing: 1px; }
    .foot { font-size: 12px; font-weight: 400; fill: #8B949E; }
  </style>

  <rect x="0.5" y="0.5" width="599" height="224" rx="12" fill="#0D1117" stroke="#30363D"/>

  <g class="s">
    <text x="32" y="50" class="name">Artem Kholdzhgonov</text>
    <text x="32" y="74" class="role">Senior Data Engineer &#183; Moscow</text>
  </g>

  <line x1="32" y1="96" x2="568" y2="96" stroke="#21262D"/>

  <g class="s">
    <text x="32" y="136" class="num">&#8804;2 TB</text>
    <text x="32" y="158" class="cap">INGESTED PER DAY</text>
    <text x="220" y="136" class="num">20&#8211;30</text>
    <text x="220" y="158" class="cap">PIPELINES IN PROD</text>
    <text x="408" y="136" class="num">&#8776;100</text>
    <text x="408" y="158" class="cap">USERS &#183; 20+ TEAMS</text>
  </g>

  <line x1="32" y1="182" x2="568" y2="182" stroke="#21262D"/>

  <g class="s">
    <text x="32" y="207" class="foot">sources &#8594; warehouse &#8594; flows &#8594; marts &#8594; BI</text>
  </g>
</svg>
