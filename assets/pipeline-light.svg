<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" role="img" aria-label="Data pipeline: sources (Kafka, S3, CSV, API) flow through Airflow and PySpark into ClickHouse and Greenplum warehouses, then into SQL marts, then into BI dashboards and alerts.">
  <style>
    .s   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .cap { font-size: 11.5px; font-weight: 600; fill: #57606A; letter-spacing: 1px; }
    .tec { font-size: 11.5px; font-weight: 500; fill: #424A53; }
  </style>

  <g fill="#F6F8FA" stroke="#D0D7DE">
    <rect x="14.5"  y="20.5" width="92"  height="80" rx="8"/>
    <rect x="132.5" y="20.5" width="92"  height="80" rx="8"/>
    <rect x="384.5" y="20.5" width="68"  height="80" rx="8"/>
    <rect x="478.5" y="20.5" width="108" height="80" rx="8"/>
  </g>
  <rect x="250.5" y="20.5" width="108" height="80" rx="8" fill="#F6F8FA" stroke="#0969DA"/>

  <g stroke="#8C959F" stroke-width="1.5">
    <line x1="110" y1="60" x2="121" y2="60"/>
    <line x1="228" y1="60" x2="239" y2="60"/>
    <line x1="362" y1="60" x2="373" y2="60"/>
    <line x1="456" y1="60" x2="467" y2="60"/>
  </g>
  <g fill="#8C959F">
    <polygon points="121,55 129,60 121,65"/>
    <polygon points="239,55 247,60 239,65"/>
    <polygon points="373,55 381,60 373,65"/>
    <polygon points="467,55 475,60 467,65"/>
  </g>

  <g class="s" text-anchor="middle">
    <text x="60"  y="47" class="cap">SOURCES</text>
    <text x="60"  y="68" class="tec">Kafka &#183; S3</text>
    <text x="60"  y="86" class="tec">CSV &#183; API</text>

    <text x="178" y="47" class="cap">FLOWS</text>
    <text x="178" y="68" class="tec">Airflow</text>
    <text x="178" y="86" class="tec">PySpark</text>

    <text x="304" y="47" class="cap" fill="#0969DA">WAREHOUSE</text>
    <text x="304" y="68" class="tec">ClickHouse</text>
    <text x="304" y="86" class="tec">Greenplum</text>

    <text x="418" y="47" class="cap">MARTS</text>
    <text x="418" y="68" class="tec">SQL</text>

    <text x="532" y="47" class="cap">BI</text>
    <text x="532" y="68" class="tec">dashboards</text>
    <text x="532" y="86" class="tec">alerts</text>
  </g>
</svg>
