<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Artem Kholdzhgonov, Senior Data Engineer. 1.36M rows per second, 500M rows in one load, 5.3 times faster than baseline.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161D"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .n  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .name  { font-size: 46px; font-weight: 700; fill: #E6EDF3; letter-spacing: -0.5px; }
      .role  { font-size: 23px; font-weight: 600; fill: #58A6FF; letter-spacing: 0.2px; }
      .sub   { font-size: 15px; font-weight: 400; fill: #8B949E; letter-spacing: 0.3px; }
      .val   { font-size: 29px; font-weight: 700; fill: #E6EDF3; }
      .lab   { font-size: 11px; font-weight: 600; fill: #8B949E; letter-spacing: 1.4px; }
      .cap   { font-size: 10px; font-weight: 600; fill: #6E7681; letter-spacing: 1.3px; }
      .tick  { font-size: 11px; font-weight: 600; fill: #8B949E; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="url(#bg)" stroke="#30363D"/>
  <rect x="0.5" y="0.5" width="5" height="319" rx="2.5" fill="#58A6FF" opacity="0.85"/>

  <g class="n">
    <text x="56" y="104" class="name">Artem Kholdzhgonov</text>
    <text x="56" y="142" class="role">Senior Data Engineer</text>
    <text x="56" y="176" class="sub">Moscow &#183; Python &#183; SQL &#183; ClickHouse &#183; Airflow &#183; Kafka &#183; Spark</text>
  </g>

  <g class="n" transform="translate(0,0)">
    <text x="1144" y="52" class="cap" text-anchor="end">INGEST TIME &#183; 5.5 GB &#183; 500M ROWS</text>
    <path d="M820 70 L920 141.6 L1020 159.8 L1120 170 L1120 190 L820 190 Z" fill="url(#area)"/>
    <polyline points="820,70 920,141.6 1020,159.8 1120,170" fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="820" cy="70" r="4" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="920" cy="141.6" r="4" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="1020" cy="159.8" r="4" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="1120" cy="170" r="5" fill="#58A6FF"/>
    <text x="820" y="60" class="tick" text-anchor="middle">1949 s</text>
    <text x="1144" y="188" class="tick" text-anchor="end">369.6 s</text>
  </g>

  <line x1="56" y1="214" x2="1144" y2="214" stroke="#30363D"/>

  <g class="n">
    <text x="56" y="258" class="val">1.36M</text>
    <text x="56" y="280" class="lab">ROWS PER SECOND</text>

    <text x="420" y="258" class="val">500M</text>
    <text x="420" y="280" class="lab">ROWS IN ONE LOAD</text>

    <text x="784" y="258" class="val">5.3&#215;</text>
    <text x="784" y="280" class="lab">FASTER THAN BASELINE</text>
  </g>
</svg>
