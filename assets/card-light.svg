<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="Artem Kholdzhgonov, Senior Data Engineer, Moscow. Up to 2 terabytes ingested per day, 20 to 30 pipelines in production, about 100 users across 20 plus teams.">
  <style>
    .s    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .name { font-size: 27px; font-weight: 600; fill: #1F2328; letter-spacing: -0.3px; }
    .role { font-size: 14px; font-weight: 500; fill: #424A53; }
    .num  { font-size: 26px; font-weight: 600; fill: #0969DA; }
    .cap  { font-size: 11.5px; font-weight: 600; fill: #57606A; letter-spacing: 1px; }
  </style>

  <rect x="0.5" y="0.5" width="599" height="189" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>

  <g class="s">
    <text x="32" y="50" class="name">Artem Kholdzhgonov</text>
    <text x="32" y="74" class="role">Senior Data Engineer &#183; Moscow</text>
  </g>

  <line x1="32" y1="96" x2="568" y2="96" stroke="#D8DEE4"/>

  <g class="s">
    <text x="32" y="136" class="num">&#8804;2 TB</text>
    <text x="32" y="158" class="cap">INGESTED PER DAY</text>
    <text x="220" y="136" class="num">20&#8211;30</text>
    <text x="220" y="158" class="cap">PIPELINES IN PROD</text>
    <text x="408" y="136" class="num">&#8776;100</text>
    <text x="408" y="158" class="cap">USERS &#183; 20+ TEAMS</text>
  </g>

</svg>
